[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/a24k/dalsegno"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
fastrand = "2"
rayon = "1"
realfft = "3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia-codec-aac = "0.6"
symphonia-core = "0.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-normalization = "0.1"
wiremock = "0.6"

dalsegno-core = { path = "crates/core" }
dalsegno-store = { path = "crates/store" }
dalsegno-io = { path = "crates/io" }
dalsegno-app = { path = "crates/app" }
dalsegno-server = { path = "crates/server" }
dalsegno-test-support = { path = "crates/test-support" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = "warn"

# Tests run FFTs over long series, which are far too slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
